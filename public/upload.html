<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>上传作业 · KSSM BM</title><style>body{margin:0;font-family:Inter,system-ui;background:#f4f7fb;color:#172033}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.btn{padding:10px 14px;border:1px solid #dbe1ea;border-radius:12px;background:#fff;text-decoration:none;color:#172033;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(15,23,42,.05)}.field{display:grid;gap:7px;margin-bottom:12px}.field label{font-size:12px;font-weight:800}.input,.select{padding:11px 12px;border:1px solid #dbe1ea;border-radius:11px;font:inherit}.drop{padding:30px;border:2px dashed #c7d2fe;border-radius:16px;text-align:center;background:#f8faff}.muted{color:#6b7280}.files{display:grid;gap:8px;margin-top:12px}.file{padding:10px;border:1px solid #e5e7eb;border-radius:10px}.steps{display:grid;gap:12px}.step b{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="margin:0">上传批改后的实体作业</h1><div class="muted">JPG / PNG / PDF</div></div><div><a class="btn" href="index.html">首页</a> <a class="btn" href="students.html">学生管理</a></div></div><div class="grid"><section class="card"><div class="field"><label>学生</label><select id="student" class="select"></select></div><div class="field"><label>作业类型</label><select id="workType" class="select"><option>学校练习 / Worksheet</option><option>作业本 / Workbook</option><option>Ujian / Test</option><option>UASA</option><option>SPM-style Paper</option><option>作文 / Karangan</option></select></div><div class="field"><label>说明</label><input id="note" class="input" placeholder="例如：Tatabahasa Set 3"></div><input id="fileInput" type="file" accept="image/*,.pdf" multiple hidden><div class="drop" onclick="fileInput.click()"><b>点击选择批改后的作业</b><div class="muted">请保留老师批改痕迹</div></div><div id="files" class="files"></div><div style="text-align:right;margin-top:14px"><button class="btn primary" onclick="goReview()">进入 OCR Review</button></div></section><aside class="card"><h3>流程</h3><div class="steps"><div class="step"><b>1. 页面质量检查</b><span class="muted">模糊、阴影、歪斜。</span></div><div class="step"><b>2. OCR 分层</b><span class="muted">题目、学生答案、老师批改。</span></div><div class="step"><b>3. 人工确认</b><span class="muted">低置信字段先确认。</span></div><div class="step"><b>4. KSSM Mapping</b><span class="muted">确认后才进入诊断。</span></div></div></aside></div></main><script src="assets/app-state.js"></script><script>const sel=document.getElementById('student');const students=BMState.getStudents();sel.innerHTML=students.map(s=>`<option value="${s.name}">${s.name} · ${s.form}</option>`).join('');const chosen=BMState.getSelectedStudent();if(chosen)sel.value=chosen.name;let picked=[];fileInput.addEventListener('change',e=>{picked=[...e.target.files];files.innerHTML=picked.map(f=>`<div class="file"><b>${f.name}</b><div class="muted">${(f.size/1024/1024).toFixed(2)} MB</div></div>`).join('')});function goReview(){if(!picked.length)return alert('请先选择文件。');const s=BMState.getStudentByName(sel.value);BMState.saveUpload({studentName:s.name,studentForm:s.form,workType:workType.value,note:note.value.trim(),files:picked.map(f=>({name:f.name,size:f.size,type:f.type}))});location.href='review.html'}</script></body></html>
