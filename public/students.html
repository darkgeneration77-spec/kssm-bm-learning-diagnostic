<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>学生管理 · KSSM BM</title><style>body{margin:0;font-family:Inter,system-ui;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.btn{padding:10px 14px;border:1px solid #dbe1ea;border-radius:12px;background:#fff;text-decoration:none;color:#172033;font-weight:700}.hero,.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(15,23,42,.05)}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.muted{color:#6b7280}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;margin-top:12px}.actions a{flex:1;text-align:center;padding:9px;border:1px solid #dbe1ea;border-radius:10px;text-decoration:none;color:#172033;font-weight:700}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top,.hero{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="margin:0">学生管理</h1><div class="muted">Cloudflare Static Assets</div></div><div><a class="btn" href="index.html">首页</a> <a class="btn" href="upload.html">上传作业</a></div></div><section class="hero"><div><h2 style="margin:0 0 6px">学生档案</h2><div class="muted">从这里进入诊断、上传与历史作业。</div></div><a class="btn" href="history.html">历史记录</a></section><section id="grid" class="grid"></section></main><script src="assets/app-state.js"></script><script>const list=BMState.getStudents();document.getElementById('grid').innerHTML=list.map(s=>`<article class="card"><h3 style="margin:0 0 5px">${s.name}</h3><div class="muted">${s.form} · ${s.cls}</div><p><span class="badge">Mastery ${s.mastery}%</span></p><p><b>主要弱点：</b>${s.weak}</p><div class="actions"><a href="analysis.html?student=${encodeURIComponent(s.name)}" onclick="BMState.selectStudent('${s.name.replace(/'/g,"\\'")}')">查看诊断</a><a href="upload.html?student=${encodeURIComponent(s.name)}" onclick="BMState.selectStudent('${s.name.replace(/'/g,"\\'")}')">上传</a></div></article>`).join('');</script></body></html>
