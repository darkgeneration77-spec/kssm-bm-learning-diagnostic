<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史作业记录 · KSSM BM</title><style>body{margin:0;font-family:Inter,system-ui;background:#f4f7fb;color:#172033}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.btn{padding:10px 14px;border:1px solid #dbe1ea;border-radius:12px;background:#fff;text-decoration:none;color:#172033;font-weight:700}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(15,23,42,.05)}.filters{display:grid;grid-template-columns:1fr 220px;gap:12px;margin-bottom:16px}.input,.select{width:100%;padding:11px 12px;border:1px solid #dbe1ea;border-radius:11px;background:#fff}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr;gap:12px;align-items:center;padding:16px;border:1px solid #e5e7eb;border-radius:15px;background:#fff}.muted{color:#6b7280;font-size:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:800}.bad{color:#b91c1c}.amber{color:#b45309}.good{color:#047857}.weak{margin-top:6px;font-size:12px;color:#9a3412}.empty{padding:28px;text-align:center;color:#6b7280}@media(max-width:800px){.item{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}@media(max-width:520px){.item{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="margin:0">历史作业记录</h1><div class="muted">每次上传、OCR Review 与分析结果都会在这里留下证据链。</div></div><div><a class="btn" href="students.html">学生管理</a> <a class="btn" href="teacher-dashboard.html">老师 Dashboard</a> <a class="btn" href="index.html">首页</a></div></div><section class="card"><div class="filters"><input id="search" class="input" placeholder="搜索学生 / 作业标题..." oninput="render()"><select id="studentFilter" class="select" onchange="render()"><option value="all">全部学生</option></select></div><div id="list" class="list"></div></section></main><script src="assets/app-state.js"></script><script>const filter=document.getElementById('studentFilter');BMState.getStudents().forEach(s=>{const o=document.createElement('option');o.value=s.name;o.textContent=s.name+' · '+s.form;filter.appendChild(o)});const selected=BMState.getSelectedStudent();if(selected)filter.value=selected.name;function render(){const q=search.value.toLowerCase(),f=filter.value;const rows=BMState.getSubmissions().filter(x=>(f==='all'||x.studentName===f)&&(!q||(x.studentName+' '+(x.title||'')+' '+(x.workType||'')).toLowerCase().includes(q)));list.innerHTML=rows.length?rows.map(x=>`<article class="item"><div><b>${x.title||x.workType}</b><div class="muted">${x.studentName} · ${x.date} · ${x.workType||'-'}</div><div class="weak">${(x.weaknesses||[]).length?'弱点：'+x.weaknesses.join(' · '):'暂无明确弱点'}</div></div><div><span class="badge">${x.status||'reviewed'}</span><div class="muted" style="margin-top:6px">${(x.files||[]).length} 个文件</div></div><div><b class="good">${x.correct||0} 对</b><div class="muted"><span class="amber">${x.partial||0} 部分</span> · <span class="bad">${x.wrong||0} 错</span></div></div><div><b>${x.questions||0} 题</b><div class="muted"><a href="analysis.html?student=${encodeURIComponent(x.studentName)}">查看学生诊断 →</a></div></div></article>`).join(''):'<div class="empty">目前没有符合条件的历史记录。</div>'}render();</script></body></html>
