<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>学生管理 · KSSM BM Learning Diagnostic</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#6b7280;--primary:#2563eb;--primary2:#7c3aed;--border:#e5e7eb;--good:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 18px 50px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eef4ff,#f8fafc 45%,#f4f7fb);color:var(--text)}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:26px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));position:relative}.logo:before,.logo:after{content:"";position:absolute;background:#fff;border-radius:99px}.logo:before{width:20px;height:6px;left:11px;top:11px}.logo:after{width:13px;height:6px;left:11px;top:23px}.brand h1{font-size:19px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none}.hero{background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:22px;padding:26px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.hero h2{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:var(--muted);line-height:1.6}.filters{margin-top:18px;display:grid;grid-template-columns:1fr 170px 170px;gap:12px}.input,.select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:12px;background:#fff;font:inherit}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:28px 0 12px}.sectionTitle h3{margin:0}.sectionTitle span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.studentHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.avatar{width:48px;height:48px;border-radius:14px;background:#eef2ff;display:grid;place-items:center;font-size:20px;font-weight:900;color:#4338ca}.studentHead h4{margin:0;font-size:17px}.studentHead p{margin:4px 0 0;color:var(--muted);font-size:12px}.badge{font-size:11px;padding:6px 9px;border-radius:999px;font-weight:800;background:#ecfdf5;color:#047857}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.mini div{background:#f8fafc;border:1px solid #eef2f7;border-radius:11px;padding:10px}.mini small{display:block;color:var(--muted);font-size:10px}.mini strong{display:block;margin-top:4px;font-size:15px}.weak{padding:11px;border-radius:11px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:14px}.actions a,.actions button{flex:1;text-align:center;padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:800;font-size:12px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalCard{width:min(520px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(15,23,42,.22)}.modalCard h3{margin-top:0}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer{margin-top:30px;color:#94a3b8;text-align:center;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters .input{grid-column:1/-1}}@media(max-width:620px){.top,.hero,.sectionTitle{align-items:flex-start;flex-direction:column}.grid,.filters,.row{grid-template-columns:1fr}.filters .input{grid-column:auto}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand"><div class="logo"></div><div><h1>学生管理</h1><p>KSSM BM Learning Diagnostic</p></div></div><div class="nav"><a class="btn" href="index.html">返回首页</a><a class="btn" href="upload.html">上传作业</a></div></div>
<section class="hero"><div><h2>学生档案</h2><p>当前先用浏览器 Demo Data 串完整流程。接上 Database 后，这里会显示真实学生的长期 mastery、弱点与进步趋势。</p></div><button class="btn primary" onclick="openModal()">+ 新增学生</button></section>
<div class="filters"><input id="search" class="input" placeholder="搜索学生姓名..." oninput="render()"><select id="formFilter" class="select" onchange="render()"><option value="all">全部年级</option><option>Tingkatan 1</option><option>Tingkatan 2</option><option>Tingkatan 3</option><option>Tingkatan 4</option><option>Tingkatan 5</option></select><select id="statusFilter" class="select" onchange="render()"><option value="all">全部状态</option><option value="stable">稳定</option><option value="improving">改善中</option><option value="attention">需关注</option></select></div>
<div class="sectionTitle"><h3>学生列表</h3><span id="count"></span></div>
<section id="studentsGrid" class="grid"></section>
<div class="footer">Student Management · Shared Demo State</div>
</main>
<div id="modal" class="modal"><div class="modalCard"><h3>新增学生</h3><div class="form"><div><label>学生姓名</label><input id="newName" class="input" placeholder="例如：Jayden"></div><div class="row"><div><label>年级</label><select id="newForm" class="select"><option>Tingkatan 1</option><option>Tingkatan 2</option><option>Tingkatan 3</option><option>Tingkatan 4</option><option>Tingkatan 5</option></select></div><div><label>班级</label><input id="newClass" class="input" placeholder="例如：2A"></div></div><div class="row"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="addStudent()">保存 Demo 学生</button></div></div></div></div>
<script src="assets/app-state.js"></script>
<script>
let students=BMState.getStudents();
function statusText(s){return s==='improving'?'改善中':s==='attention'?'需关注':'稳定'}
function render(){students=BMState.getStudents();const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('formFilter').value;const st=document.getElementById('statusFilter').value;const list=students.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(f==='all'||x.form===f)&&(st==='all'||x.status===st));document.getElementById('count').textContent=`${list.length} 位学生`;document.getElementById('studentsGrid').innerHTML=list.map(s=>`<article class="card"><div class="studentHead"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">${s.name.charAt(0)}</div><div><h4>${s.name}</h4><p>${s.form} · ${s.cls}</p></div></div><span class="badge">${statusText(s.status)}</span></div><div class="mini"><div><small>Mastery</small><strong>${s.mastery}%</strong></div><div><small>Trend</small><strong>${s.trend}</strong></div><div><small>Evidence</small><strong>${s.evidence}</strong></div></div><div class="weak"><strong>当前主要弱点</strong><br>${s.weak}</div><div class="actions"><a href="analysis.html?student=${encodeURIComponent(s.name)}" onclick="BMState.selectStudent('${s.name.replace(/'/g,"\\'")}')">查看诊断</a><a href="upload.html?student=${encodeURIComponent(s.name)}" onclick="BMState.selectStudent('${s.name.replace(/'/g,"\\'")}')">上传作业</a></div></article>`).join('')||'<div class="card">没有符合条件的学生。</div>'}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function addStudent(){const name=document.getElementById('newName').value.trim();if(!name)return alert('请输入学生姓名');students.push({name,form:document.getElementById('newForm').value,cls:document.getElementById('newClass').value.trim()||'-',mastery:0,status:'stable',weak:'尚无足够证据',trend:'—',evidence:0});BMState.saveStudents(students);closeModal();render()}
render();
</script>
</body></html>
