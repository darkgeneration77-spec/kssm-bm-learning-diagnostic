<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老师 Dashboard</title><style>body{margin:0;font-family:Inter,system-ui;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:14px}.btn{padding:10px 14px;border:1px solid #dbe1ea;border-radius:12px;background:#fff;text-decoration:none;color:#172033;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(15,23,42,.05)}.stat b{display:block;font-size:26px;margin-top:5px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.skill{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f7;gap:12px}.skill:last-child{border-bottom:0}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.red{background:#fee2e2;color:#991b1b}.amber{background:#fef3c7;color:#92400e}.green{background:#d1fae5;color:#065f46}.student{padding:12px;border:1px solid #e5e7eb;border-radius:14px;margin-top:10px}.student b{display:block}.action{margin-top:10px;padding:12px;background:#eef2ff;border-radius:12px;color:#3730a3}.links{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:560px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="margin:0">老师 Dashboard</h1><div class="muted">班级弱点、学生趋势、历史作业与待确认事项</div></div><div class="links"><a class="btn" href="history.html">历史记录</a><a class="btn" href="students.html">学生管理</a><a class="btn" href="index.html">首页</a></div></div><section class="stats"><div class="stat"><span class="muted">学生人数</span><b id="studentCount">0</b></div><div class="stat"><span class="muted">历史作业</span><b id="submissionCount">0</b></div><div class="stat"><span class="muted">需关注学生</span><b id="attentionCount">0</b></div><div class="stat"><span class="muted">改善中</span><b id="improvingCount">0</b></div></section><section class="grid"><div class="card"><h2>班级常见弱点</h2><div id="weakList"></div><div id="reteach" class="action"></div></div><div class="card"><h2>需要优先关注的学生</h2><div id="studentList"></div></div><div class="card"><h2>最近证据</h2><div id="recentList"></div></div><div class="card"><h2>老师待办</h2><div class="skill"><span>确认低置信 OCR</span><span class="badge amber">Demo</span></div><div class="skill"><span>检查 AI Skill Mapping</span><span class="badge amber">Demo</span></div><div class="skill"><span>安排补救练习</span><span class="badge red" id="remedialCount">0</span></div></div></section></main><script src="assets/app-state.js"></script><script>const students=BMState.getStudents(),subs=BMState.getSubmissions();studentCount.textContent=students.length;submissionCount.textContent=subs.length;attentionCount.textContent=students.filter(s=>s.status==='attention').length;improvingCount.textContent=students.filter(s=>s.status==='improving').length;remedialCount.textContent=students.filter(s=>s.status==='attention').length;const counts={};students.forEach(s=>(s.weak||'').split('·').map(x=>x.trim()).filter(Boolean).forEach(w=>counts[w]=(counts[w]||0)+1));subs.forEach(s=>(s.weaknesses||[]).forEach(w=>counts[w]=(counts[w]||0)+1));const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);weakList.innerHTML=top.length?top.map(([w,c],i)=>`<div class="skill"><div><b>${w}</b><div class="muted">累计证据 / 当前学生档案</div></div><span class="badge ${i<2?'red':'amber'}">${c}</span></div>`).join(''):'<div class="muted">暂无足够数据。</div>';reteach.innerHTML=top.length?`<b>建议复教：</b>优先处理 ${top[0][0]}，然后用新的独立练习验证。`:'<b>建议复教：</b>目前证据不足。';const priority=[...students].sort((a,b)=>{const p={attention:0,improving:1,stable:2};return p[a.status]-p[b.status]||a.mastery-b.mastery}).slice(0,6);studentList.innerHTML=priority.map(s=>`<div class="student"><b>${s.name}</b><div class="muted">${s.form} · ${s.cls} · ${s.weak}</div><span class="badge ${s.status==='attention'?'red':s.status==='improving'?'green':'amber'}">${s.status==='attention'?'High priority':s.status==='improving'?'Improving':'Stable'}</span> <a href="analysis.html?student=${encodeURIComponent(s.name)}" class="muted">查看诊断 →</a></div>`).join('');recentList.innerHTML=subs.slice(0,5).map(s=>`<div class="skill"><div><b>${s.studentName} · ${s.title||s.workType}</b><div class="muted">${s.date} · ${(s.weaknesses||[]).join(' · ')||'暂无明确弱点'}</div></div><span class="badge ${s.wrong>0?'red':'green'}">${s.correct||0}/${s.questions||0}</span></div>`).join('')||'<div class="muted">暂无历史作业。</div>';</script></body></html>
